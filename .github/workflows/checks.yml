name: Learner infrastructure (not completed CPU)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  infrastructure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native Verilator (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator build-essential python3 python3-venv perl
      - name: Install native Verilator (macOS)
        if: runner.os == 'macOS'
        run: brew install verilator
      - name: Tool versions
        run: |
          verilator --version
          python3 --version
      - name: Test tooling, assertions and scaffold syntax
        run: make test
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-${{ matrix.os }}
          path: build/
          retention-days: 7
